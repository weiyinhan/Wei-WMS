server:
  port: 8080
  undertow:
    # max-http-post-size: 10MB # 平替 tomcat server.tomcat.max-swallow-siz， undertow该值默认为-1
    worker-threads: 16 # 4核CPU标准配置
    buffers:
      websocket: 8192 # WebSocket缓冲 以字节为单位，这里设置为8 KB
      io: 16384 # IO操作缓冲 以字节为单位，这里设置为16 KB
  error:
    include-exception: true
    include-stacktrace: ALWAYS
    include-message: ALWAYS
  servlet:
    context-path: /jeecg-boot
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

management:
  endpoints:
    web:
      exposure:
        include: metrics,httpexchanges,jeecghttptrace

spring:
  main:
    allow-circular-references: true
  flyway:
    # 是否启用flyway
    enabled: true
    # 是否关闭要清除已有库下的表功能,生产环境必须为true,否则会删库，非常重要！！！
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    # 定时任务发送邮件
    timeJobSend: false
    host: smtp.163.com
    username: jeecgos@163.com
    password: ??
    properties:
      mail.smtp.timeout: 10000 # 连接超时（毫秒）
      mail.smtp.connectiontimeout: 10000 # 连接超时（毫秒）
      mail.smtp.writetimeout: 10000 # 写入超时（毫秒）
      mail.smtp.auth: true
      smtp.ssl.enable: true
      mail.debug: true # 启用调试模式(查看详细日志)
  ## quartz定时任务,采用数据库方式
  quartz:
    job-store-type: jdbc
    initialize-schema: embedded
    #定时任务启动开关，true-开  false-关
    auto-startup: true
    #延迟1秒启动定时任务
    startup-delay: 1s
    #启动时更新己存在的Job
    overwrite-existing-jobs: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MyScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            misfireThreshold: 12000
            clusterCheckinInterval: 15000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
  #json 时间戳统一转换
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # ===== Spring AI 配置（千问 DashScope 云端 API，兼容 OpenAI 协议）=====
  ai:
    ## ===== 方案一：本地 Ollama 部署的 DeepSeek（本地装 Ollama）=====
    #ollama:
    #  base-url: http://localhost:11434
    #  chat:
    #    options:
    #      model: deepseek-r1:7b
    #      temperature: 0.8
    # ===== 方案二：DeepSeek 云端 API（需要 API Key，兼容 OpenAI 协议）=====
    # openai:
    #   base-url: https://api.deepseek.com
    #   api-key: ${DEEPSEEK_API_KEY:REDACTED_SET_DEEPSEEK_API_KEY}
    #   chat:
    #     options:
    #       model: deepseek-chat
    #       temperature: 0.7
    # ===== 方案三：千问 DashScope 云端 API（OpenAI 兼容模式）=====
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: REDACTED_SET_DASHSCOPE_API_KEY
      chat:
        options:
          model: qwen3.8-max # 模型名称
          temperature: 0.8 # 模型温度，值越大，输出结果越随机
      # 向量模型：DashScope 没有 Spring AI 默认的 text-embedding-ada-002，必须显式指定千问向量模型
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 768 # 向量维度，必须与 ChatConfiguration 中 pgVectorStore 的 dimensions(768) 一致
  jpa:
    open-in-view: false
  aop:
    proxy-target-class: true
  #配置freemarker
  freemarker:
    # 设置模板后缀名
    suffix: .ftl
    # 设置文档类型
    content-type: text/html
    # 设置页面编码格式
    charset: UTF-8
    # 设置页面缓存
    cache: false
    prefer-file-system-access: false
    # 设置ftl文件路径
    template-loader-path:
      - classpath:/templates
    template_update_delay: 0
  # 设置静态文件路径，js,css等
  mvc:
    static-path-pattern: /**
    #Spring Boot 2.6+后映射匹配的默认策略已从AntPathMatcher更改为PathPatternParser,需要手动指定为ant-path-matcher
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
        allow:
      web-stat-filter:
        enabled: true
    dynamic:
      enabled: true #启用动态数据源，默认true
      primary: mysql #设置默认的数据源或者数据源组,默认值即为master
      druid: # 全局druid参数，绝大部分值和默认保持一致。(现已支持的参数如下,不清楚含义不要乱设置)
        # 连接池的配置信息
        # 初始化大小，最小，最大
        initial-size: 5
        min-idle: 5
        maxActive: 1000
        # 配置获取连接等待超时的时间
        maxWait: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        timeBetweenEvictionRunsMillis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # 打开PSCache，并且指定每个连接上PSCache的大小
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,slf4j
        # 允许SELECT语句的WHERE子句是一个永真条件
        wall:
          selectWhereAlwayTrueCheck: false
        # 打开mergeSql功能；慢SQL记录
        stat:
          merge-sql: true
          slow-sql-millis: 5000
      datasource:
        mysql:
          url: jdbc:mysql://127.0.0.1:3306/xingchenwms?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: 4568506
          driver-class-name: com.mysql.cj.jdbc.Driver
        postgresql:
          url: jdbc:postgresql://127.0.0.1:5432/postgres
          username: postgres
          password: your_password
          driver-class-name: org.postgresql.Driver
  #redis 配置
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      #password:
#mybatis plus 设置
mybatis-plus:
  mapper-locations: classpath*:org/jeecg/**/xml/*Mapper.xml
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      id-type: ASSIGN_ID
      # 默认数据库表下划线命名
      table-underline: true
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true
